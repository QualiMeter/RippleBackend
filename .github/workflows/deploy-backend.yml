name: Deploy Backend

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.x

      - name: Restore
        working-directory: src/Ripple.Api
        run: dotnet restore Ripple.Api.csproj

      - name: Build
        working-directory: src/Ripple.Api
        run: dotnet build Ripple.Api.csproj -c Release --no-restore

      - name: Publish
        working-directory: src/Ripple.Api
        run: dotnet publish Ripple.Api.csproj -c Release --no-build -o ../../publish

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SERVER_SSH_KEY }}

      - name: Add server to known_hosts
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -H "${{ secrets.SERVER_HOST }}" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Stop backend
        run: |
          ssh "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}" \
            "sudo systemctl stop ripple-api"

      - name: Deploy
        run: |
          tar -C publish -cf - . | ssh "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}" \
            "sudo mkdir -p /var/www/api && sudo rm -rf /var/www/api/* && sudo tar -C /var/www/api -xf - && sudo chown -R ripple-deploy:ripple-deploy /var/www/api"

      - name: Start backend
        if: always()
        run: |
          ssh "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}" \
            "sudo systemctl start ripple-api"

      - name: Check backend
        run: |
          ssh "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}" \
            "sudo -n systemctl is-active ripple-api"
