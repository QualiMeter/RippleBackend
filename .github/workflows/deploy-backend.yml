name: Deploy Backend

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.x

      - name: Restore
        working-directory: src/Ripple.Api
        run: dotnet restore Ripple.Api.csproj

      - name: Build
        working-directory: src/Ripple.Api
        run: dotnet build Ripple.Api.csproj -c Release --no-restore

      - name: Publish
        working-directory: src/Ripple.Api
        run: dotnet publish Ripple.Api.csproj -c Release --no-build -o ../../publish

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SERVER_SSH_KEY }}

      - name: Add server to known_hosts
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -H "${{ secrets.SERVER_HOST }}" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Stop backend
        run: |
          ssh "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}" \
            "sudo systemctl stop ripple-api"

      - name: Deploy
        run: |
          ssh "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}" \
            "mkdir -p /var/www/ripple/backend"
          tar -C publish -cf - . | ssh "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}" \
            "rm -rf /var/www/ripple/backend/* && tar -C /var/www/ripple/backend -xf -"

      - name: Start backend
        if: always()
        run: |
          ssh "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}" \
            "sudo systemctl start ripple-api"

      - name: Check backend
        run: |
          ssh "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}" 'bash -s' <<'REMOTE'
          for i in $(seq 1 30); do
            state=$(sudo -n systemctl is-active ripple-api || true)
            if [ "$state" = "active" ]; then
              echo "ripple-api is active"
              exit 0
            fi
            if [ "$state" = "failed" ]; then
              echo "ripple-api failed to start" >&2
              sudo -n systemctl status ripple-api --no-pager || true
              exit 1
            fi
            echo "ripple-api state: $state; waiting..."
            sleep 1
          done
          echo "ripple-api did not become active within 30 seconds" >&2
          sudo -n systemctl status ripple-api --no-pager || true
          exit 1
          REMOTE
